{% extends 'base.html' %}

{% block content %}
<h2>Edit Advertisement</h2>
<form method="POST">
    <p>Title: <input type="text" name="title" value="{{ ad.title }}" required></p>
    <p>Content:</p>
    <p><textarea name="content" rows="5" required>{{ ad.content }}</textarea></p>
    <p><input type="submit" value="Update Ad"></p>
</form>
{% endblock %}
