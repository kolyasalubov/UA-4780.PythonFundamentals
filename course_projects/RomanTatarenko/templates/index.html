{% extends 'base.html' %}

{% block content %}
{% for ad in ads %}
    <h2>{{ ad.title }}</h2>
    <p>{{ ad.content }}</p>
    <a href="{{ url_for('edit', id=ad.id) }}">Edit</a> |
    <a href="{{ url_for('delete', id=ad.id) }}">Delete</a>
    <hr>
{% else %}
    <p>No ads yet.</p>
{% endfor %}
{% endblock %}
