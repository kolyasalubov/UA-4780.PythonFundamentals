{% extends "admin/base.html" %}

{% block title %}Manage Posts{% endblock %}

{% block content %}
  <section class="admin-header">
    <h1>Manage Posts</h1>
    <a href="{{ url_for('admin.posts_new') }}">New post</a>
  </section>

  <table class="admin-table">
    <thead>
      <tr>
        <th>Title</th>
        <th>Category</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for post in posts %}
        <tr>
          <td>{{ post.title }}</td>
          <td>{{ post.category }}</td>
          <td>
            <a href="{{ url_for('admin.posts_edit', post_id=post.id) }}">Edit</a>
            <form action="{{ url_for('admin.posts_delete', post_id=post.id) }}" method="post">
              <button type="submit">Delete</button>
            </form>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
