{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
  <article class="article-shell card">
    <p class="eyebrow">{{ post.category }}</p>
    <h1>{{ post.title }}</h1>
    <p class="lead">{{ post.excerpt }}</p>
    <div class="article-body">
      <p>{{ post.content }}</p>
    </div>
  </article>
{% endblock %}
