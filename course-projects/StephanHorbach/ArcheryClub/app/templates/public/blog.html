{% extends "base.html" %}

{% block title %}Blog{% endblock %}

{% block content %}
  <section class="page-intro">
    <h1>Olympic Archery Journal</h1>
    <p>Technique, preparation, equipment, and the discipline behind Olympic recurve.</p>
  </section>

  <section class="posts-grid">
    {% for post in posts %}
      <article class="post-card">
        <p class="eyebrow">{{ post.category }}</p>
        <h2>
          <a href="{{ url_for('public.post_detail', slug=post.slug) }}">{{ post.title }}</a>
        </h2>
        <p>{{ post.excerpt }}</p>
      </article>
    {% endfor %}
  </section>
{% endblock %}
